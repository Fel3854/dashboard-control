<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Dashboard de Control — Master Bus</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <img
        class="logo"
        src="https://traficonuevo.masterbus.net/masterbus-logo.png"
        alt="Master Bus"
        onerror="this.style.display='none'"
      />
      <div class="titulos">
        <h1>Dashboard de Control</h1>
        <p class="subtitulo">Estado de los proyectos del ecosistema Master Bus</p>
      </div>
    </header>

    <main class="contenedor">
      <div id="banner-frescura" class="banner-frescura" role="alert" hidden></div>
      <div class="meta-check">
        <span id="ultimo-check">Cargando…</span>
        <span class="meta-derecha">
          <a
            id="check-now"
            class="btn-check"
            href="#"
            target="_blank"
            rel="noopener"
            title="Abre GitHub Actions para correr el chequeo ahora (botón “Run workflow”)"
            >↻ Forzar chequeo</a
          >
          <span id="resumen" class="resumen"></span>
        </span>
      </div>

      <div id="panel" class="panel" role="list" aria-live="polite">
        <!-- Filas renderizadas por app.js -->
      </div>

      <p id="mensaje-error" class="error" hidden></p>
    </main>

    <footer class="pie">
      <span>Se actualiza solo cada 60 s · pull + heartbeat · uptime 30 d · tocá un proyecto para ver el detalle</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
