name: Check & Deploy

# Corre el checker cada 10 min, commitea status.json y publica el panel en GitHub Pages.
# Pre-requisito: Settings -> Pages -> Source = "GitHub Actions" (una sola vez).
on:
  # Redeploy inmediato al cambiar la config, el checker o el frontend (no espera al cron).
  # NO incluye public/status.json (lo escribe el bot, ademas commitea con [skip ci]).
  push:
    branches: [main]
    paths:
      - 'proyectos.json'
      - 'heartbeats/**' # un heartbeat nuevo (ej. Rotacion) refresca el panel sin esperar al cron
      - 'checker/**'
      - 'public/index.html'
      - 'public/app.js'
      - 'public/styles.css'
      - '.github/workflows/check.yml'
  schedule:
    - cron: '*/10 * * * *' # cada 10 min (el minimo real de Actions es ~5 min; puede demorarse)
  workflow_dispatch: # permite correr manual ("Check now")
    inputs:
      test_alerta:
        description: 'Enviar una alerta de PRUEBA por email/Telegram (para verificar los canales)'
        type: boolean
        default: false

# contents: write -> commitear status.json | pages+id-token: write -> deploy a Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Evita corridas pisandose entre si (no cancela un deploy en curso).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    # MAIL_SERVER / TELEGRAM_BOT_TOKEN se exponen como env para condicionar los steps de
    # alerta: si el secret no esta configurado, env queda vacio y el envio se saltea (no
    # rompe el run). Asi ambos canales (email y Telegram) son opcionales e independientes.
    env:
      MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Dead-man switch externo (opcional): URL de un check en healthchecks.io. Si esta vacio,
      # los pings se saltean (el sistema funciona igual, sin el aviso externo).
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      # Destinatario extra para alertas CRITICAS (opcional): escalamiento a mas gente/guardia.
      MAIL_TO_CRITICO: ${{ secrets.MAIL_TO_CRITICO }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24' # LTS; Node 20 llego a EOL (el codigo pide >=20, compatible)

      # Corre los tests (node --test) ANTES de commitear/deployar. Solo en push/dispatch
      # (cambios de codigo): NO en el cron cada 10 min, para no meter ruido en el loop de
      # monitoreo. Si un test falla, el job corta aca y no se deploya un checker roto.
      - name: Correr tests
        if: github.event_name != 'schedule'
        run: npm test

      # Lee public/status.json previo (del checkout), escribe el nuevo y, via el hook,
      # corre notify.js: si hubo transicion, deja los outputs `alerta`/`asunto`.
      - name: Correr checker
        id: checker
        env:
          # Si se corre a mano con el input "test_alerta", manda una alerta de prueba.
          TEST_ALERTA: ${{ inputs.test_alerta && '1' || '' }}
          # Credenciales de los chequeos FUNCIONALES con login. Si un set no esta cargado como
          # Secret, ese chequeo queda FUNCION_OMITIDA y el checker sigue igual (degradacion elegante).
          CUBIERTAS_USER: ${{ secrets.CUBIERTAS_USER }}
          CUBIERTAS_PASS: ${{ secrets.CUBIERTAS_PASS }}
          ERP_EMAIL: ${{ secrets.ERP_EMAIL }}
          ERP_PASS: ${{ secrets.ERP_PASS }}
          CAP_EMAIL: ${{ secrets.CAP_EMAIL }}
          CAP_PASS: ${{ secrets.CAP_PASS }}
          CAP_SUPABASE_ANON_KEY: ${{ secrets.CAP_SUPABASE_ANON_KEY }}
        run: node checker/check.js

      # Persiste status.json ("desde"), alertas-estado.json (cooldown) e history.json (uptime).
      - name: Commitear estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/status.json public/history.json alertas-estado.json history.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el estado"
          else
            git commit -m "chore: update status.json [skip ci]"
            # status.json/history.json son GENERADOS: no se mergean a mano. Si otra corrida
            # pusheo en el medio (origin se movio), rebaseamos prefiriendo NUESTRA version
            # recien generada (-X theirs = el commit que se aplica) y reintentamos el push.
            # Asi un choque entre corridas no rompe el deploy.
            pushed=""
            for intento in 1 2 3 4 5; do
              git fetch -q origin main || continue
              if ! git rebase -X theirs origin/main; then
                git rebase --abort || true
                continue
              fi
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep 2
            done
            if [ -z "$pushed" ]; then
              echo "::warning::No se pudo pushear el estado tras varios reintentos (otra corrida lo hara)"
            fi
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artifact (public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # deploy-pages a veces falla con "Deployment failed, try again later" (flakiness del
      # lado de GitHub, intermitente). Un reintento resuelve la mayoria; si AMBOS fallan,
      # el run queda rojo de verdad. Ojo: las alertas de abajo usan always() para correr
      # igual aunque el deploy falle (un blip de Pages no debe tragarse un aviso de caida).
      - name: Deploy a Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy a Pages (reintento)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # Fase 2: envia el email SOLO si notify.js marco una alerta y hay SMTP configurado.
      # Va al final para no bloquear el deploy si fallara el envio.
      - name: Enviar alerta por email
        id: email
        # always(): que la alerta salga aunque el deploy de Pages haya fallado (si fallo el
        # CHECKER, `alerta` queda vacio y este step se saltea igual, asi que no hay riesgo).
        if: always() && steps.checker.outputs.alerta == 'true' && env.MAIL_SERVER != ''
        continue-on-error: true # una alerta que falla (ej. SMTP) NO debe tirar el deploy
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.checker.outputs.asunto }}
          to: ${{ secrets.MAIL_TO }}
          from: Dashboard Control <${{ secrets.MAIL_USERNAME }}>
          body: file://alerta-cuerpo.txt

      # Escalamiento: si la alerta es CRITICA (servicio critico caido) y hay una lista de
      # escalamiento configurada, mandar TAMBIEN a esos destinatarios (guardia / mas gente).
      - name: Escalar alerta CRITICA por email
        id: email_critico
        if: always() && steps.checker.outputs.alerta == 'true' && steps.checker.outputs.severidad == 'CRITICO' && env.MAIL_SERVER != '' && env.MAIL_TO_CRITICO != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.checker.outputs.asunto }}
          to: ${{ secrets.MAIL_TO_CRITICO }}
          from: Dashboard Control <${{ secrets.MAIL_USERNAME }}>
          body: file://alerta-cuerpo.txt

      # Alerta por Telegram (opcional): reusa el mismo cuerpo que arma notify.js. Se activa
      # solo si TELEGRAM_BOT_TOKEN esta configurado. Crear el bot con @BotFather y obtener el
      # chat_id (ver README). No usa Action externa: un curl a la Bot API alcanza.
      - name: Enviar alerta por Telegram
        id: telegram
        if: always() && steps.checker.outputs.alerta == 'true' && env.TELEGRAM_BOT_TOKEN != ''
        continue-on-error: true # idem: si Telegram falla, el deploy igual queda verde
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ASUNTO: ${{ steps.checker.outputs.asunto }}
        run: |
          { printf '%s\n\n' "$ASUNTO"; cat alerta-cuerpo.txt; } > telegram-msg.txt
          curl -sS --fail \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@telegram-msg.txt" \
            --data "disable_web_page_preview=true"

      # "Quien vigila al vigilante": si HABIA una alerta para mandar pero NINGUN canal la
      # entrego (SMTP roto, Telegram caido, o ambos sin configurar), no dejar el run en verde
      # en silencio. Lo marcamos en rojo (visible en Actions) y, si esta el dead-man switch,
      # lo pinchamos con /fail para que healthchecks.io avise por afuera. Un step salteado
      # (canal no configurado) tiene outcome 'skipped', que tampoco cuenta como entregado.
      - name: Verificar entrega de alerta
        if: always() && steps.checker.outputs.alerta == 'true'
        run: |
          email='${{ steps.email.outcome }}'
          tg='${{ steps.telegram.outcome }}'
          if [ "$email" != "success" ] && [ "$tg" != "success" ]; then
            echo "::error::Habia una alerta para enviar pero ningun canal la entrego (email=$email, telegram=$tg)."
            if [ -n "$HEALTHCHECK_URL" ]; then curl -fsS -m 10 "${HEALTHCHECK_URL}/fail" || true; fi
            exit 1
          fi
          echo "Alerta entregada (email=$email, telegram=$tg)."

      # Dead-man switch: avisa por AFUERA de GitHub si el checker deja de correr. Al final de
      # cada corrida pinguea healthchecks.io: OK si el checker corrio, /fail si fallo. Si GitHub
      # deja de disparar el cron (o Actions se cae), healthchecks.io no recibe el ping dentro de
      # su ventana y manda la alerta el solo -> detecta "el monitor mismo se murio". Se activa
      # solo si HEALTHCHECK_URL esta configurado.
      - name: Dead-man switch (healthchecks.io)
        if: always() && env.HEALTHCHECK_URL != ''
        run: |
          if [ "${{ steps.checker.outcome }}" = "success" ]; then
            curl -fsS -m 10 "$HEALTHCHECK_URL" || true
          else
            curl -fsS -m 10 "${HEALTHCHECK_URL}/fail" || true
          fi
