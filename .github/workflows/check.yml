name: Check & Deploy

# Corre el checker cada 10 min, commitea status.json y publica el panel en GitHub Pages.
# Pre-requisito: Settings -> Pages -> Source = "GitHub Actions" (una sola vez).
on:
  schedule:
    - cron: '*/10 * * * *' # cada 10 min (el minimo real de Actions es ~5 min; puede demorarse)
  workflow_dispatch: {} # permite correr manual ("Check now")

# contents: write -> commitear status.json | pages+id-token: write -> deploy a Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Evita corridas pisandose entre si (no cancela un deploy en curso).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    # MAIL_SERVER se expone como env para condicionar el step de email: si el secret no
    # esta configurado, env queda vacio y el envio se saltea (no rompe el run).
    env:
      MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Lee public/status.json previo (del checkout), escribe el nuevo y, via el hook,
      # corre notify.js: si hubo transicion, deja los outputs `alerta`/`asunto`.
      - name: Correr checker
        id: checker
        run: node checker/check.js

      # Persiste status.json (para "desde") y alertas-estado.json (para el cooldown).
      - name: Commitear estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/status.json alertas-estado.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el estado"
          else
            git commit -m "chore: update status.json [skip ci]"
            git push
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artifact (public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy a Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Fase 2: envia el email SOLO si notify.js marco una alerta y hay SMTP configurado.
      # Va al final para no bloquear el deploy si fallara el envio.
      - name: Enviar alerta por email
        if: steps.checker.outputs.alerta == 'true' && env.MAIL_SERVER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.checker.outputs.asunto }}
          to: ${{ secrets.MAIL_TO }}
          from: Dashboard Control <${{ secrets.MAIL_USERNAME }}>
          body: file://alerta-cuerpo.txt
