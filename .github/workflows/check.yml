name: Check & Deploy

# Corre el checker cada 10 min, commitea status.json y publica el panel en GitHub Pages.
# Pre-requisito: Settings -> Pages -> Source = "GitHub Actions" (una sola vez).
on:
  # Redeploy inmediato al cambiar la config, el checker o el frontend (no espera al cron).
  # NO incluye public/status.json (lo escribe el bot, ademas commitea con [skip ci]).
  push:
    branches: [main]
    paths:
      - 'proyectos.json'
      - 'checker/**'
      - 'public/index.html'
      - 'public/app.js'
      - 'public/styles.css'
      - '.github/workflows/check.yml'
  schedule:
    - cron: '*/10 * * * *' # cada 10 min (el minimo real de Actions es ~5 min; puede demorarse)
  workflow_dispatch: # permite correr manual ("Check now")
    inputs:
      test_alerta:
        description: 'Enviar una alerta de PRUEBA por email/Telegram (para verificar los canales)'
        type: boolean
        default: false

# contents: write -> commitear status.json | pages+id-token: write -> deploy a Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Evita corridas pisandose entre si (no cancela un deploy en curso).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    # MAIL_SERVER / TELEGRAM_BOT_TOKEN se exponen como env para condicionar los steps de
    # alerta: si el secret no esta configurado, env queda vacio y el envio se saltea (no
    # rompe el run). Asi ambos canales (email y Telegram) son opcionales e independientes.
    env:
      MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Lee public/status.json previo (del checkout), escribe el nuevo y, via el hook,
      # corre notify.js: si hubo transicion, deja los outputs `alerta`/`asunto`.
      - name: Correr checker
        id: checker
        env:
          # Si se corre a mano con el input "test_alerta", manda una alerta de prueba.
          TEST_ALERTA: ${{ inputs.test_alerta && '1' || '' }}
        run: node checker/check.js

      # Persiste status.json ("desde"), alertas-estado.json (cooldown) e history.json (uptime).
      - name: Commitear estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/status.json public/history.json alertas-estado.json history.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el estado"
          else
            git commit -m "chore: update status.json [skip ci]"
            # Rebase por si el ping de un heartbeat (u otra corrida) pusheo en el medio.
            git pull --rebase origin main
            git push
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artifact (public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy a Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Fase 2: envia el email SOLO si notify.js marco una alerta y hay SMTP configurado.
      # Va al final para no bloquear el deploy si fallara el envio.
      - name: Enviar alerta por email
        if: steps.checker.outputs.alerta == 'true' && env.MAIL_SERVER != ''
        continue-on-error: true # una alerta que falla (ej. SMTP) NO debe tirar el deploy
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.checker.outputs.asunto }}
          to: ${{ secrets.MAIL_TO }}
          from: Dashboard Control <${{ secrets.MAIL_USERNAME }}>
          body: file://alerta-cuerpo.txt

      # Alerta por Telegram (opcional): reusa el mismo cuerpo que arma notify.js. Se activa
      # solo si TELEGRAM_BOT_TOKEN esta configurado. Crear el bot con @BotFather y obtener el
      # chat_id (ver README). No usa Action externa: un curl a la Bot API alcanza.
      - name: Enviar alerta por Telegram
        if: steps.checker.outputs.alerta == 'true' && env.TELEGRAM_BOT_TOKEN != ''
        continue-on-error: true # idem: si Telegram falla, el deploy igual queda verde
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ASUNTO: ${{ steps.checker.outputs.asunto }}
        run: |
          { printf '%s\n\n' "$ASUNTO"; cat alerta-cuerpo.txt; } > telegram-msg.txt
          curl -sS --fail \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@telegram-msg.txt" \
            --data "disable_web_page_preview=true"
